name: Recover stable crates publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable stable tag whose source should be published
        required: true
        default: v1.15.0
        type: string

permissions:
  contents: read

jobs:
  recover:
    name: Publish crates from exact stable tag
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Check out recovery workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract immutable release source
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SOURCE_DIR="${RUNNER_TEMP}/tokmd-release-source"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must be a stable semantic-version tag such as v1.15.0"
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          SOURCE_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          test -f scripts/publish-release-crates.sh || {
            echo "::error::recovery publisher is missing from the workflow source checkout"
            exit 1
          }
          rm -rf "${RELEASE_SOURCE_DIR}"
          mkdir -p "${RELEASE_SOURCE_DIR}"
          git archive --format=tar "${RELEASE_TAG}" | tar -xf - -C "${RELEASE_SOURCE_DIR}"
          test -f "${RELEASE_SOURCE_DIR}/Cargo.toml"
          if ! grep -Fqx 'tokmd-format = { path = "crates/tokmd-format" }' "${RELEASE_SOURCE_DIR}/Cargo.toml"; then
            printf '\ntokmd-format = { path = "crates/tokmd-format" }\n' >> "${RELEASE_SOURCE_DIR}/Cargo.toml"
          fi
          git -C "${RELEASE_SOURCE_DIR}" init --quiet
          git -C "${RELEASE_SOURCE_DIR}" config user.name "tokmd release recovery"
          git -C "${RELEASE_SOURCE_DIR}" config user.email "release-recovery@users.noreply.github.com"
          git -C "${RELEASE_SOURCE_DIR}" add --all --force
          git -C "${RELEASE_SOURCE_DIR}" commit --quiet -m "recovery: immutable stable release source"
          {
            echo "## Stable crate publication recovery"
            echo "- tag: ${RELEASE_TAG}"
            echo "- source_commit: ${SOURCE_COMMIT}"
            echo "- source: extracted immutable tag archive"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up stable Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Publish exact stable crates
        working-directory: ${{ runner.temp }}/tokmd-release-source
        shell: bash
        run: bash "${GITHUB_WORKSPACE}/scripts/publish-release-crates.sh"
