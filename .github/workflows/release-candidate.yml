name: Release Candidate Container Proof

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Final publication commit or branch to prove before tagging
        required: true
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-platform:
    name: Build ${{ matrix.platform }} candidate image
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            target: x86_64-unknown-linux-gnu
            cross: false
          - platform: linux/arm64
            suffix: arm64
            target: aarch64-unknown-linux-gnu
            cross: true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Resolve source commit and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tokmd") | .version' | head -n 1)"
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "::error::workspace tokmd version could not be resolved"
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build platform binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}" --bin tokmd
          else
            cargo build --release --locked --target "${{ matrix.target }}" --bin tokmd
          fi
          cp "target/${{ matrix.target }}/release/tokmd" artifacts/tokmd
          test -x artifacts/tokmd

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform candidate image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/effortlessmetrics/tokmd:candidate-${{ steps.source.outputs.commit }}-${{ matrix.suffix }}
          build-args: |
            BINARY=artifacts/tokmd
            VERSION=${{ steps.source.outputs.version }}
            SOURCE_COMMIT=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=tokmd-candidate-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=tokmd-candidate-${{ matrix.suffix }}

  assemble-and-verify:
    name: Assemble and verify pre-tag candidate image
    needs: build-platform
    if: github.repository == 'EffortlessMetrics/tokmd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve source commit and version
        id: source
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse HEAD)"
          VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tokmd") | .version' | head -n 1)"
          if [[ -z "${VERSION}" || "${VERSION}" == "null" ]]; then
            echo "::error::workspace tokmd version could not be resolved"
            exit 1
          fi
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble multi-architecture candidate manifest
        shell: bash
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/effortlessmetrics/tokmd"
          docker buildx imagetools create \
            --tag "${IMAGE}:${CANDIDATE_TAG}" \
            "${IMAGE}:${CANDIDATE_TAG}-amd64" \
            "${IMAGE}:${CANDIDATE_TAG}-arm64"

      - name: Verify candidate anonymously and record digest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          COMMIT: ${{ steps.source.outputs.commit }}
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/effortlessmetrics/tokmd"
          REF="${IMAGE}:${CANDIDATE_TAG}"
          DOCKER_CONFIG="$(mktemp -d)"
          FIXTURE="$(mktemp -d)"
          MANIFEST="$(mktemp)"
          export DOCKER_CONFIG
          trap 'rm -rf "${DOCKER_CONFIG}" "${FIXTURE}" "${MANIFEST}"' EXIT
          PULL_OUTPUT="$(docker --config "${DOCKER_CONFIG}" pull "${REF}" 2>&1 | tee /dev/stderr)"
          docker --config "${DOCKER_CONFIG}" manifest inspect "${REF}" > "${MANIFEST}"
          jq -e '[.manifests[] | select(.platform != null) | "\(.platform.os)/\(.platform.architecture)"] as $p | ($p | index("linux/amd64") != null and index("linux/arm64") != null)' "${MANIFEST}" > /dev/null
          OUT="$(docker --config "${DOCKER_CONFIG}" run --rm "${REF}" --version)"
          if ! grep -qxE "tokmd ${EXPECTED_VERSION}([[:space:]]|$)" <<<"${OUT}"; then
            echo "::error::candidate reported an unexpected version: ${OUT}"
            exit 1
          fi
          DIGEST="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${PULL_OUTPUT}")"
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::candidate digest was not immutable: ${DIGEST}"
            exit 1
          fi
          mkdir -p "${FIXTURE}/src" artifacts
          printf 'pub fn add(a: i32, b: i32) -> i32 { a + b }\n' > "${FIXTURE}/src/lib.rs"
          git -C "${FIXTURE}" init -q
          git -C "${FIXTURE}" -c user.email=ci@tokmd.dev -c user.name=tokmd-ci add .
          git -C "${FIXTURE}" -c user.email=ci@tokmd.dev -c user.name=tokmd-ci commit -q -m fixture
          docker --config "${DOCKER_CONFIG}" run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/repo -v "${FIXTURE}:/repo" -w /repo "${REF}" \
            packet generate --preset bun-ub --base HEAD --head HEAD --no-syntax src
          test "$(jq -r '.schema' "${FIXTURE}/sensors/tokmd/manifest.json")" = 'tokmd.evidence-packet/v1'
          test "$(jq -r '.status' "${FIXTURE}/sensors/tokmd/manifest.json")" = 'complete'
          test -s "${FIXTURE}/sensors/tokmd/analyze.json"
          test "$(jq -r '.artifacts | length' "${FIXTURE}/sensors/tokmd/manifest.json")" -gt 0
          jq -e '.mode == "analysis" and .status == "complete" and (.source.inputs | length > 0) and (.derived != null)' \
            "${FIXTURE}/sensors/tokmd/analyze.json" > /dev/null
          jq -n \
            --arg schema 'tokmd.release-candidate/v1' \
            --arg commit "${COMMIT}" \
            --arg version "${EXPECTED_VERSION}" \
            --arg candidate "${REF}" \
            --arg digest "${DIGEST}" \
            '{schema:$schema, source_commit:$commit, version:$version, candidate_ref:$candidate, digest:$digest, platforms:["linux/amd64","linux/arm64"], anonymous_pull:true, version_smoke:true, mounted_packet:{schema:"tokmd.evidence-packet/v1", status:"complete", content:true}}' \
            > "artifacts/container-candidate-${COMMIT}.json"
          {
            echo "## Pre-tag container candidate proof"
            echo "- source_commit: ${COMMIT}"
            echo "- candidate_ref: ${REF}"
            echo "- version: ${EXPECTED_VERSION}"
            echo "- platforms: linux/amd64, linux/arm64"
            echo "- digest: ${DIGEST}"
            echo "- anonymous_pull: pass"
            echo "- version_smoke: pass"
            echo "- mounted_packet: pass"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload candidate receipt
        uses: actions/upload-artifact@v7
        with:
          name: container-candidate-${{ steps.source.outputs.commit }}
          path: artifacts/container-candidate-${{ steps.source.outputs.commit }}.json
          if-no-files-found: error

      - name: Mark candidate verified
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.source.outputs.commit }}
          CANDIDATE_TAG: ${{ steps.source.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/effortlessmetrics/tokmd"
          DIGEST="$(jq -r '.digest' "artifacts/container-candidate-${COMMIT}.json")"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx imagetools create \
            --tag "${IMAGE}:verified-candidate-${COMMIT}" \
            "${IMAGE}@${DIGEST}"
          VERIFIED_PULL="$(docker pull "${IMAGE}:verified-candidate-${COMMIT}" 2>&1 | tee /dev/stderr)"
          VERIFIED="$(awk '$1 == "Digest:" { print $2; exit }' <<<"${VERIFIED_PULL}")"
          if [[ "${VERIFIED}" != "${DIGEST}" ]]; then
            echo "::error::verified candidate marker resolved to ${VERIFIED}, expected ${DIGEST}"
            exit 1
          fi
          {
            echo "- verified_candidate_tag: ${IMAGE}:verified-candidate-${COMMIT}"
            echo "- verified_candidate_digest: ${VERIFIED}"
            echo "- verification_marker: pass"
          } >> "$GITHUB_STEP_SUMMARY"
