# .github/settings.yml
# This file is synced to GitHub repository settings by the 'Settings' Probot app.
# Documentation: https://probot.github.io/apps/settings/

repository:
  description: "Code intelligence for humans, machines, and LLMs: receipts, metrics, and insights from your codebase."
  homepage: "https://github.com/EffortlessMetrics/tokmd"
  topics:
    - markdown
    - rust
    - code-analysis
    - cli
    - tsv
    - csv
    - jsonl
    - github-actions
    - tokei
    - code-metrics
    - repository-analysis
    - llm
    - llmops
    - receipts
    - inventory

  # Merge Settings
  # Squash stays the method for normal development PRs in both repos.
  # Merge commits must remain enabled because publication imports from
  # tokmd-swarm into tokmd are deliberate merge commits; see
  # docs/ci/swarm-routing.md ("Publication" under Merge Policy).
  allow_squash_merge: true
  allow_merge_commit: true
  allow_rebase_merge: false
  delete_branch_on_merge: true
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY

  # Features
  has_issues: true
  has_projects: false
  has_wiki: false
  has_downloads: true

branches:
  - name: main
    protection:
      # Codex is the exact-head reviewer for this single-maintainer workflow;
      # native human approval and CODEOWNERS review are intentionally absent.
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - "Tokmd Rust Result"
          - "Codex Review Gate"
      enforce_admins: false
      # Not linear: publication imports land as two-parent merge commits, and
      # tokmd-swarm/main then fast-forwards onto them. Requiring linear history
      # would block the documented import path in docs/ci/swarm-routing.md.
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
